name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. PYTHON CHECKS ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax Check & Import Verification
        working-directory: app
        run: |
          python -m compileall .
          python -c "import app"

      # --- 2. TERRAFORM & SECURITY ---
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init & Validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true

      # --- 3. DOCKER INTEGRATION TEST ---
      - name: Build Local Test Image
        run: docker build -t flask-ecs-cicd-demo:test app

      - name: Test Container Health
        run: |
          docker run -d --name flask-demo -p 5000:5000 flask-ecs-cicd-demo:test
          sleep 5
          curl --fail http://localhost:5000/health
          curl --fail http://localhost:5000/info

      - name: Cleanup Container
        if: always()
        run: |
          docker stop flask-demo || true
          docker rm flask-demo || true
